<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TASK B1 (1 pt): Add Tailwind Play CDN in <head> -->
      <script src="https://cdn.tailwindcss.com"></script>

    <title>Send Message (POST)</title>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
      <h1 class="text-2xl font-semibold mb-4 text-gray-800">
        Send Message (POST)
      </h1>
      <input
        type="text"
        id="msg"
        placeholder="Type a message..."
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
      />
      <button
        id="btnSend"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition"
      >
        Send
      </button>
      <button
    id="btnClear"
    class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500 transition"
  >
    Clear
  </button>
      <div
        id="status"
        class="text-sm text-gray-600"
      >
        ...
    </div>
      <pre
        id="output"
        class="bg-gray-100 p-3 rounded text-sm text-gray-800 overflow-x-auto"
      ></pre>
    </div>

    <!-- TASK B1 (1 pt): Link post/app.js (use defer) -->
    <script src="./app.js" defer></script>


  </body>
</html>
